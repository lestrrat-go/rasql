name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  check:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Run the full suite
        # internal/conformance's TestGeneratedFootprintBuild attributes the
        # performance evidence it writes to the commit that produced it, so
        # it requires RASQL_CONFORMANCE_COMMIT rather than treating a blank
        # value as something to skip past; GitHub already knows the commit
        # this run is testing, so hand it over instead of leaving the test
        # to guess at one through build-info stamping that a sandboxed
        # runner can silently fail to produce.
        env:
          RASQL_CONFORMANCE_COMMIT: ${{ github.sha }}
        run: go test -p 1 -count=1 -v ./...
      - run: go vet ./...
      # The sample runs on PostgreSQL, so its tests and its generated-store
      # check both need a live server and run in the "integration" job. This
      # job has no database, and builds it.
      - name: Sample module
        working-directory: sample/taskboard
        run: go build ./...

  windows-plan-lock:
    name: Windows plan lock
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Run native Windows plan-lock tests
        shell: bash
        run: >-
          go test -count=1 -v
          -run '^(TestPlanLockHashVectors|TestSQLitePlanLockIdentity|TestSQLitePlanLockUnsafeTargets|TestSQLitePlanLockBlocksProcess|TestSQLitePlanLockCancellation)$'
          ./migrate

  integration:
    name: Database integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v5.4.0
      - name: Bring up live databases
        run: docker compose up -d --wait
      - name: Run the suite against live databases
        env:
          RASQL_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/rasql?parseTime=true
          RASQL_TEST_POSTGRES_DSN: postgres://rasql:rasql@127.0.0.1:5432/rasql?sslmode=disable
        # -v and the package list are deliberate: every package here holds
        # at least one test guarded by internal/dbtest, which skips
        # silently when a DSN is unset. Without -v, a skip and a pass look
        # identical in this job's own log, and go test ./... -v across the
        # whole module (measured: ~4200 lines) buries the live tests under
        # ~2000 unrelated unit tests. Naming just these packages keeps the
        # log scoped to what this job exists to prove, while ./... still
        # runs (with -v, and without a DSN) in the "check" job, so every
        # package's assertions remain covered by one of the two jobs.
        # TestIntegrationJobListsEveryDBTestGuardedPackage reads this exact
        # step and fails when the command stops covering a package whose
        # tests are guarded by internal/dbtest, or carries an argument its
        # parser cannot classify. goTestArgs in
        # ci_integration_coverage_test.go owns which flags this command may
        # use, and is the complete list: it rejects every command that would
        # leave this job green without running the tests these packages are
        # listed for, or without naming them in the log, in each spelling go
        # accepts -- and it reads the flags it allows for their effective
        # value, since go's own parsing lets a later assignment overturn an
        # earlier one.
        run: go test -p 1 -count=1 -v ./catalog/... ./cli/rasqlgen/... ./cli/rasqlmigrate/... ./generate/... ./inspect/... ./internal/catalogread/... ./internal/engineprofile/... ./internal/rowvalue/... ./internal/schemasource/... ./migrate/... ./render/... .

      - name: Run D4 conformance matrix
        env:
          RASQL_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/rasql?parseTime=true
          RASQL_TEST_POSTGRES_DSN: postgres://rasql:rasql@127.0.0.1:5432/rasql?sslmode=disable
          RASQL_CONFORMANCE_OUTPUT: ${{ github.workspace }}/.tmp/d4-conformance.json
          RASQL_CONFORMANCE_LOG: ${{ github.workspace }}/.tmp/d4-conformance.log
        run: mkdir -p .tmp && ./scripts/conformance.sh live
      - name: Upload D4 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-conformance-evidence
          path: |
            .tmp/d4-conformance.log
            .tmp/d4-conformance.json
          if-no-files-found: error

      # sample/taskboard is a module of its own. Its offline check reads the
      # checked-in lock and generated files without a database. Its live tests
      # use the migrated database below.
      - name: Create the sample's databases
        run: |
          docker compose exec -T postgres psql -U rasql -d postgres \
            -c 'CREATE DATABASE taskboard;'

      - name: Check the sample's generated store
        working-directory: sample/taskboard
        run: |
          unset TASKBOARD_SCHEMA_DSN TASKBOARD_DSN TASKBOARD_TEST_DSN
          test -z "${TASKBOARD_SCHEMA_DSN-}"
          test -z "${TASKBOARD_DSN-}"
          test -z "${TASKBOARD_TEST_DSN-}"
          ./scripts/rasql.sh check

      - name: Migrate the sample's test database
        working-directory: sample/taskboard
        env:
          TASKBOARD_DSN: postgres://rasql:rasql@127.0.0.1:5432/taskboard?sslmode=disable
        run: ./scripts/migrate.sh apply

      - name: Run the sample's tests against a live database
        working-directory: sample/taskboard
        env:
          TASKBOARD_TEST_DSN: postgres://rasql:rasql@127.0.0.1:5432/taskboard?sslmode=disable
        run: go test -count=1 -v ./...
