name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  check:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      # This job publishes no conformance evidence, so it sets no
      # RASQL_CONFORMANCE_COMMIT: nothing it runs needs a commit to attribute
      # a measurement to. Leaving it unset also lets
      # TestConformanceEnvironmentRequiresObservedBuildData run here rather
      # than skip, which is what pins that `go test` stamps no vcs.* setting
      # into a test binary. The "integration" job's conformance step gets its
      # commit from scripts/conformance.sh, which reads `git rev-parse HEAD`.
      - name: Run the full suite
        run: ./scripts/test.sh check
      - run: go vet ./...
      # examples/store is generated from examples/db/migrations through a
      # throwaway SQLite database, so this check needs no server: -scratch
      # builds that database, applies the migrations, regenerates in memory,
      # and compares against the checked-in files.
      - name: Check the examples' generated store
        run: go run ./cmd/rasql codegen check -config examples/rasql.json -scratch
      # The sample runs on PostgreSQL, so its tests need a live server and run
      # in the "integration" job. This job has no database, and builds the
      # module and checks its generated store against its checked-in inputs,
      # neither of which needs one.
      - name: Sample module
        working-directory: sample/taskboard
        run: go build ./...
      - name: Check the sample's generated store
        working-directory: sample/taskboard
        run: |
          unset TASKBOARD_DSN TASKBOARD_TEST_DSN
          test -z "${TASKBOARD_DSN-}"
          test -z "${TASKBOARD_TEST_DSN-}"
          ./scripts/rasql.sh codegen check

  integration:
    name: Database integration
    runs-on: ubuntu-latest
    # Every step below that reaches a database reads these two, so the job
    # holds one copy each rather than a copy per step.
    env:
      RASQL_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/rasql?parseTime=true
      RASQL_TEST_POSTGRES_DSN: postgres://rasql:rasql@127.0.0.1:5432/rasql?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2
        with:
          version: v5.4.0
      - name: Bring up live databases
        run: docker compose up -d --wait
      # The script derives its package list from the tree, naming every
      # package whose tests import internal/dbtest, and fixes the flags that
      # keep this job from ending green without touching a database. Both
      # rules, and why each matters, live in scripts/test.sh.
      - name: Run the suite against live databases
        run: ./scripts/test.sh live

      # scripts/conformance.sh writes the evidence uploaded below, to the
      # .tmp paths it defaults to, and fails when either DSN is unset.
      - name: Run D4 conformance matrix
        run: ./scripts/conformance.sh live
      - name: Upload D4 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-conformance-evidence
          path: |
            .tmp/d4-conformance-live.log
            .tmp/d4-conformance-live.json
          if-no-files-found: error

      # sample/taskboard is a module of its own. Its offline check ran in the
      # "check" job, without a database; its live check and its tests use the
      # migrated database below.
      - name: Create the sample's databases
        run: |
          docker compose exec -T postgres psql -U rasql -d postgres \
            -c 'CREATE DATABASE taskboard;'

      - name: Migrate the sample's test database
        working-directory: sample/taskboard
        env:
          TASKBOARD_DSN: postgres://rasql:rasql@127.0.0.1:5432/taskboard?sslmode=disable
        run: ./scripts/migrate.sh apply

      - name: Check the sample's generated store against the database
        working-directory: sample/taskboard
        run: ./scripts/rasql.sh codegen check -dsn "postgres://rasql:rasql@127.0.0.1:5432/taskboard?sslmode=disable"

      - name: Run the sample's tests against a live database
        working-directory: sample/taskboard
        env:
          TASKBOARD_TEST_DSN: postgres://rasql:rasql@127.0.0.1:5432/taskboard?sslmode=disable
        run: go test -count=1 -v ./...
