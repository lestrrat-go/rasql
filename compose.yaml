# Live-database services for rasql. This is the single definition of them:
# the `integration` job in .github/workflows/ci.yml brings this file up as a
# workflow step, and a developer brings it up locally the same way. Ports
# are fixed so RASQL_TEST_POSTGRES_DSN / RASQL_TEST_MYSQL_DSN can point at
# them unchanged in both places.
#
# Bring both up with:
#
#   docker compose up -d --wait
#
# internal/dbtest never runs Docker itself; a live test skips when the
# relevant DSN environment variable is not set, naming this command. Once
# up, containers are never torn down automatically; stop them yourself with:
#
#   docker compose down -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rasql
      POSTGRES_PASSWORD: rasql
      POSTGRES_USER: rasql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rasql", "-d", "rasql"]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rasql
      MYSQL_PASSWORD: rasql
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: rasql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urasql", "-prasql"]
      interval: 5s
      timeout: 5s
      retries: 12
